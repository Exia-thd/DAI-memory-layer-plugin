packages:
  - 'packages/*'

# Dependencies allowed to run their install scripts.
#
# Four of them need to, and one of them is not optional: @ladybugdb/core ships
# a binary per platform as an optional dependency and copies the right one into
# place in a postinstall script. Skip it and every command dies with
# `lbugjs.node: cannot open shared object file`, which reads as a broken build
# rather than a skipped script.
#
# The same four exceptions are declared three times, once per pnpm generation,
# because each one reads a different place and ignores the others:
#
#   pnpm 9   package.json, `pnpm.onlyBuiltDependencies`
#   pnpm 10  this file, `onlyBuiltDependencies`
#   pnpm 12  this file, `allowBuilds`
#
# pnpm 12 still *reports* onlyBuiltDependencies through `pnpm config get`, but
# builds nothing from it: a fresh install exits with ERR_PNPM_IGNORED_BUILDS
# naming these four, and anyone who ignores that error has a store whose native
# module cannot load. Each key is harmless to the generations that do not read
# it, so all three stay until the oldest is no longer used anywhere.
onlyBuiltDependencies:
  - '@ladybugdb/core'
  - onnxruntime-node
  - protobufjs
  - sharp
allowBuilds:
  '@ladybugdb/core': true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
